[workspace]
resolver = "3"
members = ["crates/ntm-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
ntm-core = { path = "crates/ntm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
