[workspace]
resolver = "3"
members = ["crates/ntm-core", "mods/ntm-logic-server", "mods/ntm-logic-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
ntm-core = { path = "crates/ntm-core" }
horizon-mod-sdk = { path = "/home/sacer/Games/horizon/crates/horizon-mod-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
