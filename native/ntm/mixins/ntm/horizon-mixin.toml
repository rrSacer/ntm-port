[mod]
id = "ntm"
version = "0.1.0"
priority = 100

# The commit it was built and tested on: ntm-next (upstream main plus the
# merged hook PRs; its `pins`). It uses only named hook points.
[compatibility]
horizon_revision = "88b45bdb21dbf32d8d2550ecba604f33a9fe84eb"

# The logic, plain Rust (cargo test against the fake world): copied into
# this folder by tools/package-native.sh, never kept here.
[[crate]]
id = "core"
path = "ntm-core"

[[injection]]
id = "lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "lifecycle.rs"
bindings = [
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

# A machine's block entity (L1): its state, slots and menu data through
# ntm_core::native.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "ntm_glue"
source = "glue.rs"

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "be.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "container.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

# The clients' models (V3): the types, and what each update carries.
[[injection]]
id = "block-entity-types"
hook = "block_entity_types"
hook_version = 1
kind = "HEAD"
helper = "types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "&mut *types" },
]

[[injection]]
id = "block-entity-update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "update_tag.rs"
bindings = [
  { name = "id", ty = "&str", value = "id" },
  { name = "nbt", ty = "&horizon_world::nbt::Compound", value = "nbt" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

# The slots' rules (V2, API 20).
[[injection]]
id = "slot-filters"
hook = "slot_filters"
hook_version = 1
kind = "HEAD"
helper = "filters.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "filters", ty = "&mut Vec<horizon_client::containers::ModSlotFilter>", value = "&mut *filters" },
]

# The server (L3): its phases at the end of each server tick, the machine
# and cable blocks that change, the menus' buttons.
[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::ServerTickPhase", value = "phase" },
]

[[injection]]
id = "block-changed"
hook = "block_changed"
hook_version = 1
kind = "HEAD"
helper = "block_changed.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "old", ty = "horizon_world::registry::BlockStateId", value = "old" },
  { name = "new", ty = "horizon_world::registry::BlockStateId", value = "new" },
]

[[injection]]
id = "menu-button"
hook = "menu_button"
hook_version = 1
kind = "HEAD"
helper = "menu_button.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "id", ty = "i32", value = "id" },
]
