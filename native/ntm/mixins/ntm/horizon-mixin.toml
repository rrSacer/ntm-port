[mod]
id = "ntm"
version = "0.1.0"
priority = 100

# Current upstream plus reusable model, multiblock and container extensions.
# Keep the exact integration pin: official API alone lacks those extensions.
[compatibility]
horizon_revision = "d07e7117a2b2c039d2a409ff999665cb8a3c8921"

# The logic, plain Rust (cargo test against the fake world): copied into
# this folder by tools/package-native.sh, never kept here.
[[crate]]
id = "core"
path = "ntm-core"

[[injection]]
id = "lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "lifecycle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

# Existing API 306: only a flushed world save acknowledges effect receipts.
[[injection]]
id = "world-save-receipts"
hook = "world_saved"
hook_version = 1
kind = "HEAD"
helper = "world_saved.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "wait", ty = "bool", value = "wait" },
]

# A machine's block entity (L1): its state, slots and menu data through
# ntm_core::native.
[[injection]]
id = "waste-soil-random-tick"
hook = "random_tick"
hook_version = 1
kind = "HEAD"
helper = "soil_tick.rs"
bindings = [
  { name = "level", ty = "&mut crate::game::GameLevel<'_>", value = "&mut *self" },
  { name = "ticks", ty = "&mut horizon_world::level::Ticks", value = "&mut *ticks" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "ntm_glue"
source = "glue.rs"

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "be.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "container.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

# The clients' models (V3): the types, and what each update carries.
[[injection]]
id = "block-entity-update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

# The slots' rules (V2, API 20).
[[injection]]
