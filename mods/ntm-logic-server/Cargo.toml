[package]
name = "ntm-logic-server"
description = "NTM port: machines, energy and persistence (Horizon server mod)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ntm-core.workspace = true
horizon-mod-sdk.workspace = true

[features]
# Capability `machines` of the Horizon patch ntm-visual (docs/visual-fiel.md):
# machines whose items are the engine's slots. A Horizon without the patch
# refuses a mod that imports it, so it is off by default.
machines = ["ntm-core/machines"]
